services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5001
      PYTHONPATH: /app
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app/web
      - ./data:/app/data
      - ./evaluation/results:/app/evaluation/results
