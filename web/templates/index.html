<!DOCTYPE html>
<html lang="en" data-direction="console" data-density="comfortable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEP · Compliance Graph-RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- ../static/... resolves to /static/... when served by Flask at "/" and to web/static/... when opened directly -->
  <link rel="stylesheet" href="../static/css/kep.css" />
</head>
<body>
  <div class="app">
    <header class="hdr">
      <div class="hdr-brand">
        <div class="hdr-logo">K</div>
        <div class="hdr-title">KEP <span class="sub">· Compliance Graph-RAG</span></div>
      </div>
      <div class="hdr-spacer"></div>
      <div class="switcher">
        <button data-dir="console" class="on">Console</button>
        <button data-dir="terminal">Terminal</button>
        <button data-dir="schematic">Schematic</button>
      </div>
      <div class="hdr-status"><span class="dot" id="statusDot"></span> <span id="statusLbl" class="hdr-mono">connecting…</span></div>
      <div class="settings-wrap">
        <button class="icon-btn" id="gearBtn" title="Display settings" aria-label="Display settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <div class="settings-pop hidden" id="settingsPop">
          <div class="settings-row">
            <span class="eyebrow settings-label">Accent</span>
            <div class="swatches" id="swatches"></div>
          </div>
          <div class="settings-row">
            <span class="eyebrow settings-label">Density</span>
            <div class="seg">
              <button data-dens="comfortable" class="on">Comfortable</button>
              <button data-dens="compact">Compact</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="body">
      <aside class="pane pane-l" id="leftPane"></aside>
      <main class="pane pane-c" id="centerPane"></main>
      <aside class="pane pane-r" id="rightPane"></aside>
    </div>
  </div>

  <script src="../static/js/kep-demo.js"></script>
  <script src="../static/js/kep-graph.js"></script>
  <script src="../static/js/kep-app.js"></script>
</body>
</html>
